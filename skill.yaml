name: closing-code-ai
display_name: "Closing Code AI — Sales Engine"
description: "AI-powered sales call analysis for high-ticket closers. Pre-call briefs + post-call scoring 0-70 with proprietary Closing Cuántico™ methodology. Native integration with Closing Code AI backend. Full English & Spanish support."
version: 1.3.1
author: "The Closing Code AI"
license: proprietary
copyright: "© 2026 The Closing Code AI. Todos los derechos reservados."
terms_url: https://closingcodeai.com/terms
redistribution: false
homepage: https://closingcodeai.online
repository: https://github.com/quantum-agent-MGM/closing-code-ai-skill

platforms:
  - linux
  - macos
  - windows

languages:
  - en
  - es

requires:
  hermes: ">=0.13.0"
  python: ">=3.11"

environment:
  required:
    - HERMES_GATEWAY_URL
    - TELEGRAM_BOT_TOKEN
  optional:
    - HERMES_CLOSING_CODE_API_KEY
    - CLOSING_CODE_AI_BASE_URL
    - WHATSAPP_WEBHOOK_URL

post_install_message: |
  ✅ Closing Code AI skill installed.

  Try it now with a real call:
  "Generate the QC 4.1 for this call"

  If it doesn't respond:
  1. Check that HERMES_CLOSING_CODE_API_KEY is configured
  2. Confirm you're on the correct profile
  3. Try again with: "Analyze this sales call"

tiers:
  signal-lite:
    name: "Signal Lite"
    price: 0
    price_currency: USD
    billing: free
    description: "Brief pre-llamada básico vía Telegram/WhatsApp"
    features:
      - buyer-profiling-basic
      - pre-call-brief
      - telegram-delivery
    limits:
      calls_per_month: 20
      closers: 1

  closer-engine:
    name: "Closer Engine"
    price: 197
    price_currency: USD
    billing: monthly
    description: "Full post-call analysis against Closing Cuántico™ QC_4_1. Premium HTML report rendered from raw LLM markdown — rich in content, not a summary. The client gets every insight the LLM generated."
    features:
      - buyer-profiling-basic
      - pre-call-brief
      - post-call-analysis
      - transcription-whisper
      - score-0-70
      - error-timestamps
      - improvement-suggestions
      - followup-brief-auto
      - history-comparison
      - html-3tier-report
      - telegram-delivery
      - whatsapp-delivery
    limits:
      calls_per_month: 100
      closers: 1
    requires_upgrade_from: signal-lite

  closing-code-pro:
    name: "Closing Code Pro"
    price: 497
    price_currency: USD
    billing: monthly
    description: "Multi-closer + reporte semanal + buyer profiling avanzado + deal prediction ML"
    features:
      - buyer-profiling-advanced
      - pre-call-brief
      - post-call-analysis
      - transcription-whisper
      - score-0-70
      - error-timestamps
      - improvement-suggestions
      - followup-brief-auto
      - history-comparison
      - html-3tier-report
      - multi-closer-tracking
      - weekly-team-report
      - deal-prediction-ml
      - intent-signals
      - crm-sync
      - telegram-delivery
      - whatsapp-delivery
      - api-access
    limits:
      calls_per_month: unlimited
      closers: unlimited
    requires_upgrade_from: closer-engine

categories:
  - sales
  - coaching
  - analytics
  - productivity

tags:
  - sales
  - closing
  - call-analysis
  - coaching
  - closing-code-ai
  - whisper
  - post-call
  - pre-call
  - deal-prediction
  - buyer-profiling

related_skills:
  - hermes-sales-engine
  - methodology-alignment

entry_points:
  natural_language:
    - trigger: "Analiza esta llamada de ventas"
      description: "Activate post-call analysis flow"
    - trigger: "Genera el QC 4.1 de esta llamada"
      description: "Generate full QC 4.1 report"
    - trigger: "Dame el score de cierre de esta grabación"
      description: "Get closing score for a recording"
    - trigger: "Qué hizo mal el closer aquí"
      description: "Get coaching on what went wrong"
    - trigger: "Haz coaching sobre esta llamada de ventas"
      description: "Receive coaching on the call"
  webhook:
    - path: /webhook/closing-code-ai
      method: POST
      description: "Receive Closing Code AI call analysis completions — NOT YET AVAILABLE. Polling GET /v1/calls/{id}/analysis required until webhook outbound is implemented."

dependencies:
  python_packages:
    - requests
    - pyyaml
  external_services:
    - name: closing-code-ai-api
      description: "Closing Code AI backend API — incluye metodología privada"
      required_for_tiers: [closer-engine, closing-code-pro]
      endpoints:
        - /v1/calls/ingest
        - /v1/calls/{id}/analysis
        - /v1/methodology/closing-cuantico  → Privado, requiere API key
        - /v1/methodology/scoring-rubric    → Privado, requiere API key
    - name: whisper-transcription
      description: "Groq Whisper (primary) with chunked processing for calls >20 min. OpenAI fallback. Local whisper only for <15 min."
      required_for_tiers: [closer-engine, closing-code-pro]

metadata:
  hermes:
    tags: [sales, closing, coaching, call-analysis, closing-code-ai]
    related_skills: [hermes-sales-engine, methodology-alignment]
    min_hermes_version: "0.13.0"
